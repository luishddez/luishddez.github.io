<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Modo de vista: auto (según el ancho), app o escritorio. Se guarda por aparato. */(function(){var d=document.documentElement,p="auto";try{p=localStorage.getItem("tablero-vista")||"auto"}catch(e){}function calc(){var m=p==="app"||p==="escritorio"?p:(window.innerWidth>=900?"escritorio":"app");if(d.getAttribute("data-vista")!==m){d.setAttribute("data-vista",m);window.dispatchEvent(new Event("cambio-vista"))}}window.__vista={pref:function(){return p},modo:function(){return d.getAttribute("data-vista")},set:function(x){p=x;try{localStorage.setItem("tablero-vista",x)}catch(e){}calc()}};calc();window.addEventListener("resize",calc);try{matchMedia("(min-width:900px)").addEventListener("change",calc)}catch(e){}})();</script>
<meta name="theme-color" content="#fff4e0">

<title>Mi día</title>
<style>
/* Colores con significado fijo, siempre con una palabra o un ícono además del color:
   verde = lo que toca ahora · azul = agendado en Calendar · gris = opcional o libre · ámbar = facilitador.
   Texto con contraste mayor a 4.5:1. */
:root{--bg:#fbf7ef;--bg2:#ffe9c2;--card:#ffffff;--ink:#1d1a14;--mute:#5d574b;--line:#e7dfcf;--sh:0 1px 2px rgba(60,40,10,.07);
 --now:#17603f;--now-t:#0d5a38;--now-g1:#dff4e8;--now-g2:#bfe6d1;
 --cal:#1d4a9c;--cal-t:#153a85;--cal-g1:#e4ecfc;--cal-g2:#c9d9f6;
 --opt:#5d574b;--opt-g1:#f3efe6;--opt-g2:#e9e3d5;
 --fac-bg:#fff0bf;--fac-t:#5a4200;--fri-bg:#fde0cd;--fri-t:#7a3000;
 --warn:#8a4b00;--warn-bg:#fdf1e0;--star:#b36b00;
 --k-cal:#1d4a9c;--k-ess:#b8860b;--k-tar:#17603f;--k-comida:#d9480f;--k-gym:#be185d;--k-rut:#6d28d9;--k-otro:#78716c;
 /* 3b-0 (2026-11-27): antes eran valores sueltos en las reglas; mismos valores, ahora con nombre */
 --on-now:#fff;--rec:#c62828;--rec-deep:#b71c1c;--on-rec:#fff;--rec-ring:rgba(198,40,40,.35);
 --fire:#d9480f;--on-fire:#fff;--fire-bg:#ffd9a8;--fire-ink:#3a1d00;--now-line:#d1542b;--track:rgba(0,0,0,.09);
 --sh-pop:0 8px 24px rgba(0,0,0,.2);--sh-panel:-10px 0 28px rgba(0,0,0,.2);--sh-sel:0 6px 18px rgba(0,0,0,.28);--sh-bar:0 -6px 22px rgba(0,0,0,.18);
 /* 3b-1: escala de radios de la Guía de marca (6 · 12 · 18 · píldora). Antes 10 · 12 · 14 · 16 · 18 */
 --r-s:6px;--r-m:12px;--r-l:12px;--r-xl:18px;--r-2xl:18px;--r-pill:999px}
/* 3b-1 (2026-11-27): tema oscuro con la paleta de la Guía de marca del Diseñador (OLED). Sin sombras: un borde de 1 px hace de contorno.
   Extensiones sobre la paleta, por legibilidad: --cal-t (tinte claro del secundario para texto) y el violeta de Proyectos (--k-rut). */
:root[data-tema="oscuro"]{--bg:#000000;--bg2:#08281a;--card:#0b0b0d;--ink:#f2f2f2;--mute:#8a8a92;--line:#424a46;--sh:0 0 0 1px var(--line);
 --now:#0df2a6;--now-t:#0df2a6;--now-g1:#08281a;--now-g2:#0b0b0d;
 --cal:#2e89b8;--cal-t:#5fb3de;--cal-g1:#0c2330;--cal-g2:#0b0b0d;
 --opt:#8a8a92;--opt-g1:#161618;--opt-g2:#0b0b0d;
 --fac-bg:#3b3210;--fac-t:#ffe08a;--fri-bg:#40251a;--fri-t:#ffc7a8;
 --warn:#f0b36a;--warn-bg:#2c2214;--star:#ffcb6b;
 --k-cal:#2e89b8;--k-ess:#f5c542;--k-tar:#0df2a6;--k-comida:#ff8a50;--k-gym:#f472b6;--k-rut:#b79cff;--k-otro:#a8a29e;
 --on-now:#111111;--fire-bg:#5a3412;--fire-ink:#ffe2bd;--track:rgba(255,255,255,.12)}
/* Un color por tipo de actividad: azul Calendar · dorado esencial · verde tarea · naranja comida · rosa gym · morado rutina (mañana y cierre) · gris lo demás */
.k-cal{--k:var(--k-cal)} .k-ess{--k:var(--k-ess)} .k-tar{--k:var(--k-tar)} .k-comida{--k:var(--k-comida)} .k-gym{--k:var(--k-gym)} .k-rut{--k:var(--k-rut)} .k-otro{--k:var(--k-otro)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:680px;margin-inline:auto;
 /* La página no se desplaza: se desplaza solo #vista por dentro. Así la barra del navegador del celular se queda quieta. */
 position:fixed;top:0;bottom:0;left:0;right:0;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
html{height:100%;overflow:hidden;overscroll-behavior:none}
#vista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:var(--cap-h) 16px 72px}
button{font:inherit;color:inherit;border:0;background:var(--card);border-radius:var(--r-l);padding:11px 16px;cursor:pointer;box-shadow:var(--sh)}
button:active{transform:scale(.97)}
button.pri{background:var(--now);color:var(--on-now);font-weight:700}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 2px}
.saludo{font-size:18px;font-weight:800;letter-spacing:-.01em}
.fechaTxt{color:var(--mute);font-size:12.5px;margin-top:1px}
/* Sol interactivo: sale, cruza el cielo y se pone según la hora; de noche sale la luna */
.hdr{display:flex;gap:10px;align-items:center}
.sol{width:54px;height:54px;padding:0;border-radius:50%;overflow:hidden;flex:none;box-shadow:var(--sh);background:none}
.sol svg{width:100%;height:100%;display:block}
.sol.pulso{animation:pulso .8s ease}
@keyframes pulso{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-8deg)}60%{transform:scale(.95) rotate(6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sol.pulso{animation:none}}
/* Frase mínima: una línea, apagada; al tocarla se abre completa con su autor */
.frase{margin:0 0 10px;padding:0;cursor:pointer}
.frase q{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font:italic 13.5px/1.35 Georgia,"Times New Roman",serif;quotes:none;color:var(--mute)}
.frase.open q{display:block}
.frase small{display:none;color:var(--mute);font-size:11.5px;margin-top:3px}
.frase.open small{display:block}
.esencial-l{font-size:13px;color:var(--mute);margin:0 0 8px}
.mini{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:12px 2px 4px}
.dc-r{font-size:12px;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dc-r .falta{color:var(--k-comida);font-weight:700}
.hero{border-radius:var(--r-2xl);padding:14px 16px;margin-bottom:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--now) 11%,var(--card)),var(--card) 65%);border:1px solid var(--line);position:relative}
.hero.cal{background:linear-gradient(135deg,var(--cal-g1),var(--card) 65%)}
/* Hoy (2026-11-27): aquí se ejecuta. "Ahora" es el bloque fuerte; "Siguiente paso" es una tarjeta secundaria con el color de su sección (azul trabajo, violeta proyectos). */
.hero.paso{background:var(--card);border-left:4px solid var(--cal)}
.hero.paso.pt .etq{color:var(--cal-t)}
.hero.paso.pp{border-left-color:var(--k-rut)} .hero.paso.pp .etq{color:var(--k-rut)}
.hero.paso h2{font-size:17px}
.hoy-top{margin-bottom:4px}
.hoy-rail>h3:first-child{margin-top:14px}
.hoy-rail details>summary{min-height:44px;display:flex;align-items:center}
.hero.opt,.hero.libre{background:var(--opt-g1)}
.hero .cab{display:flex;gap:12px;align-items:center}
.ico{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:2.5px solid var(--k,transparent)}
.etq{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--now-t)}
.hero.cal .etq{color:var(--cal-t)} .hero.opt .etq,.hero.libre .etq{color:var(--opt)}
.hero h2{font-size:19px;line-height:1.2;margin:2px 0 0;letter-spacing:-.01em}
.hero .hora{color:var(--mute);font-size:13px;margin-top:8px}
.hero .acc{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.hero .acc .pri{font-size:17px;padding:11px 22px;border-radius:var(--r-l)}
.bar{height:6px;background:var(--track);border-radius:var(--r-s);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--now),#3fae7a);width:0;border-radius:var(--r-s);transition:width .5s}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chip{display:flex;gap:7px;align-items:flex-start;border-radius:var(--r-s);padding:5px 10px;font-size:13px;line-height:1.3}
.chip.f{background:var(--fac-bg);color:var(--fac-t)} .chip.r{background:var(--fri-bg);color:var(--fri-t)}
.chip b{white-space:nowrap}
.estado{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;text-align:center}
.ring .c b{font-size:16px} .ring .c small{font-size:11px;color:var(--mute)}
.pills{display:flex;flex-direction:column;gap:5px;flex:1;font-size:13.5px}
.pill{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:var(--r-s);padding:5px 10px}
.pill span{color:var(--mute)}
.aviso{background:var(--warn-bg);border-left:5px solid var(--warn);color:var(--ink);border-radius:var(--r-m);padding:8px 12px;margin-bottom:10px;font-size:14px}
.libre-ok{background:var(--now-g1);border-radius:var(--r-l);padding:9px 12px;margin-bottom:10px;font-size:14px}
h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:20px 2px 8px}
.it{display:flex;gap:11px;align-items:center;background:transparent;border-radius:0;padding:9px 4px 9px 12px;margin-bottom:0;border-bottom:1px solid var(--line)}
.it .e{font-size:22px;width:30px;text-align:center;flex:none}
.it .h{display:block;color:var(--mute);font-size:11.5px}
.it .t{flex:1;min-width:0;font-size:15px}
.it{box-shadow:inset 3px 0 0 var(--k,var(--k-otro))}
.it.opc{opacity:.6}   /* opcional: se atenúa en lugar de ponerle una etiqueta */
.it .chips{margin-top:6px}
details{margin-top:6px} summary{cursor:pointer;color:var(--mute);font-size:13px;padding:6px 2px}
.hecho{text-decoration:line-through;color:var(--mute)}
.nota{font-size:14px;color:var(--mute)}
/* La barra queda sobre la etiqueta "Powered by Netlify" (esquina inferior derecha), para que no tape Anotar ni el dictado */
/* Anotar: un botón redondo abajo a la IZQUIERDA (la etiqueta de Netlify queda a la derecha y no estorba).
   🎤 dicta a texto · ➤ guarda cuando ya hay texto. La caja de texto aparece arriba solo cuando hace falta. No ocupa espacio de la pantalla. */
/* 2026-11-27: la captura (dictar y anotar) es UNA barra de vidrio arriba, flotando sobre el contenido: el contenido pasa por detrás, desenfocado.
   Minimalista: sin círculo de color; el micrófono es un ícono de línea que se enciende con el acento al escribir. Celular: pastilla compacta. Escritorio: más ancha, con atajo (/), Guardar ↵ y Esc. */
:root{--cap-h:62px}
#zona{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#cap{position:absolute;top:6px;left:16px;right:16px;z-index:5;border-radius:var(--r-2xl);background:color-mix(in srgb,var(--card) 70%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);border:1px solid color-mix(in srgb,var(--line) 65%,transparent);transition:border-color .16s,box-shadow .16s}
#cap:focus-within{border-color:color-mix(in srgb,var(--now) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 12%,transparent)}
.cap-row{display:flex;align-items:center;gap:4px;padding:2px 4px 2px 2px}
.cap-b{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--mute);box-shadow:none;transition:color .16s,background .16s}
.cap-b svg{width:20px;height:20px;display:block}
#cap:focus-within .cap-b,.cap-b:hover{color:var(--now)}
.cap-b:hover{background:color-mix(in srgb,var(--now) 10%,transparent)}
.cap-b.rec{background:var(--rec);color:var(--on-rec);animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.cap-b.rec{animation:none}#cap{transition:none}}
#capIn{flex:1;min-width:0;font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);min-height:44px;padding:0 4px;outline:none}
#capIn::placeholder{color:var(--mute);opacity:1}
.cap-k,.cap-go{display:none}
.cap-x{flex:none;width:44px;height:44px;padding:0;border-radius:50%;font-size:14px;box-shadow:none;background:transparent;color:var(--mute)}
#cap:not(.tiene) .cap-x{display:none}
.comp-h{font-size:12.5px;color:var(--mute);padding:0 14px 6px}
.comp-h:empty{display:none}
.cap-re{font-size:12.5px;min-height:44px;padding:0 12px;margin:0 8px 6px;box-shadow:none;background:transparent;border:1px solid var(--line);border-radius:var(--r-s);font-weight:700}

 /* celular con texto: el botón redondo se vuelve "guardar" y toma el acento */
 :where(:root[data-vista="app"]) #cap.tiene .cap-b:not(.rec){background:var(--now);color:var(--on-now)}


 :where(:root[data-vista="escritorio"]) #cap{left:24px;right:24px;top:8px}
 :root[data-vista="escritorio"]{--cap-h:66px}
 :where(:root[data-vista="escritorio"]) #capIn{font-size:17px}
 :where(:root[data-vista="escritorio"]) #cap:not(.tiene) .cap-k{display:inline-flex}
 :where(:root[data-vista="escritorio"]) .cap-k, :where(:root[data-vista="escritorio"]) .cap-go kbd{align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;font:600 12px/1 system-ui,sans-serif;color:var(--mute);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:6px;background:transparent}
 :where(:root[data-vista="escritorio"]) #cap.tiene .cap-go{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;margin-right:4px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--now) 18%,transparent);color:var(--now);font-weight:600;box-shadow:none}
 :where(:root[data-vista="escritorio"]) #cap.tiene .cap-go:hover{background:color-mix(in srgb,var(--now) 28%,transparent)}
 :where(:root[data-vista="escritorio"]) #cap.tiene .cap-go kbd{color:inherit;border-color:currentColor;opacity:.7}
 :where(:root[data-vista="escritorio"]) .cap-x:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
 :where(:root[data-vista="escritorio"]) .comp-h{padding:0 16px 8px;font-size:13px}

/* Hoy · Mañana · Semana: tres opciones en orden de tiempo */
.seg{flex:none;display:flex;gap:18px;margin:4px 16px 8px;padding:0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;box-shadow:none;background:transparent;border-radius:0;padding:4px 0;font-size:14px;color:var(--mute);border-bottom:2px solid transparent}
.seg button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--now)}
.dia-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 2px 8px;font-size:17px}
.dia-card.sola{cursor:default}
.atras{margin:0 0 8px;padding:6px 12px;font-size:13.5px;border-radius:var(--r-m)}
.sem-d{display:block;width:100%;text-align:left;padding:10px 12px 8px;margin-bottom:8px;border-radius:var(--r-l);background:transparent;box-shadow:none;border:1px solid var(--line)}
.sem-d.hoy{box-shadow:inset 0 0 0 2px var(--now),var(--sh)}
.sem-d .dc-strip{margin-top:6px;height:18px}
.sem-n{font-size:15px} .sem-m{font-size:12.5px;color:var(--mute);margin-top:5px;min-height:16px}
.sg-e{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:13px;line-height:1;z-index:2;pointer-events:none}
#menu{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:0 16px 40px;z-index:5}
#menu .in{max-width:680px;margin:0 auto}
#menu .top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
#menu h1{font-size:22px;margin:0}
.card{background:var(--card);border-radius:var(--r-xl);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.card .it2{padding:6px 0;border-top:1px solid var(--line);font-size:15px} .card .it2:first-of-type{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=time]{font:inherit;border:1.5px solid var(--line);border-radius:var(--r-s);padding:8px;background:var(--card);color:var(--ink)}
.hide{display:none!important}
/* Proyectos: mapa de conexiones. Un solo color de acento (el verde de siempre); sin colores por área, el área va escrita */
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 6px}
.pfil{padding:7px 12px;font-size:13.5px;border-radius:var(--r-pill);background:transparent;box-shadow:none;border:1px solid var(--line);color:var(--ink)}
.pfil.on{background:var(--now);border-color:var(--now);color:var(--on-now);font-weight:700}
:where(:root[data-vista="app"]) .pfil{min-height:44px;padding:0 16px}
.pmapa{overflow:auto;height:min(62vh,620px);border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.pmapa svg{display:block}
.pe{stroke:var(--line);stroke-width:1.6}
.pe.on{stroke:var(--now);stroke-width:3}
.pe.dim{opacity:.35}
.pn{cursor:pointer}
.pn rect{fill:var(--card);stroke:var(--mute);stroke-width:1.2;stroke-opacity:.55}
.pn.idea rect{fill:var(--opt-g1);stroke-dasharray:4 3}
.pn.sel rect{stroke:var(--now);stroke-width:3;stroke-opacity:1}
.pn.dim{opacity:.25}
.pn .nm{font-size:12px;font-weight:700;fill:var(--ink)}
.pn .sub{font-size:10.5px;fill:var(--mute)}
.pn:focus-visible rect{stroke:var(--now);stroke-width:3;stroke-opacity:1}
/* Inicio v2: barra del día (un color neutro, nunca rojo) y siguiente paso con contexto */
.pbl{margin:0 0 10px}
.pbarra{display:flex;gap:3px;height:9px}
.pbarra i{flex:1;border-radius:5px;background:var(--line)}
.pbarra i.on{background:var(--now)}
.hero.paso .pk2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 0 2px}
.hero.paso .pv{font-size:14.5px;line-height:1.35}
.pmapa.cc{height:min(36vh,340px)}   /* con una tarjeta abierta el mapa se achica para que ambos quepan en la pantalla */
/* Inicio tablero (i1): un solo foco arriba y columnas por sección. Un color = una sección, siempre con nombre e ícono. Nunca rojo. */
.ihead{margin:6px 2px 10px;font-size:15px}
.ihero{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--now) 11%,var(--card)),var(--card) 65%);border-radius:var(--r-2xl);padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.iring{position:relative;width:84px;height:84px}
.iring svg{display:block;transform:rotate(-90deg)}
.iring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;line-height:1}
.iring small{font-size:10.5px;font-weight:400;color:var(--mute);margin-top:2px}
.ieb{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--now-t)}
.ihero h2{font-size:19px;line-height:1.25;margin:3px 0 2px;letter-spacing:-.01em}
.iacts{display:flex;flex-direction:column;gap:6px}
.iacts button{min-height:44px;padding:0 18px}
.icols{display:grid;grid-template-columns:1fr;gap:16px}
.icol-h{display:flex;align-items:center;gap:7px;font-weight:700;border-bottom:3px solid var(--a);padding-bottom:6px;margin-bottom:8px}
.icol-h small{margin-left:auto;font-weight:400;font-size:12px;color:var(--mute)}
.icd{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--line);box-shadow:var(--sh);min-height:44px;font:inherit}
button.icd{cursor:pointer}
.icd.top{background:color-mix(in srgb,var(--a) 13%,var(--card));border-left-color:var(--a)}
.icd.vacio{background:transparent;box-shadow:none;border:1px dashed var(--line);border-left:4px solid var(--line);color:var(--mute)}
.icd.vacio .icd-x{font-weight:400}
.idrag{display:flex;align-items:stretch;gap:6px;margin-bottom:8px;border-radius:var(--r-m)}
.idrag[draggable="true"]{cursor:grab}
.idrag .icd{margin-bottom:0;flex:1;min-width:0}
.imv{display:none;flex:none;gap:6px}
.imv button{min-width:44px;min-height:44px;padding:0;font-size:15px}
.idrag:focus-within .imv{display:inline-flex}
@media (pointer:coarse){.imv{display:inline-flex}.pcls2{min-width:44px;min-height:44px}}
:where(:root[data-vista="app"]) .imv{display:inline-flex}
:where(:root[data-vista="app"]) .pcls2{min-width:44px;min-height:44px}
/* arriba del Inicio siempre a la mano: Deshacer y Modo enfoque no se pierden al desplazarte */
.ihead{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0;margin:0 0 6px}
:where(:root[data-vista="app"]) .ihead>b{display:none}   /* en celular la fecha ya sale en el saludo de arriba */
.idrag.arr{opacity:.45}
.idrag.sobre{outline:2px dashed var(--a);outline-offset:2px}
.ihead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ideshacer{min-height:44px;padding:0 14px}
.ifoco{min-height:44px;padding:0 14px;margin-left:auto}
.ifoco.on{background:var(--now);color:var(--on-now)}
.icols.foco{opacity:.16;filter:grayscale(1);pointer-events:none;user-select:none;transition:opacity .2s}
.ifoco-n{text-align:center;margin-top:10px}
@media (prefers-reduced-motion:reduce){.icols.foco{transition:none}}
.icd-x{display:block;font-weight:700;font-size:14.5px;line-height:1.3}
.icd-p{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.imas{font-size:12px;color:var(--mute);text-align:center;padding:4px}
.iidea{display:block;width:100%;text-align:left;font-size:13px;padding:9px 10px;margin-bottom:6px;border-radius:var(--r-s);background:transparent;border:1px dashed var(--line);box-shadow:none;min-height:44px}
.ipri{margin-top:12px;background:var(--card);border-radius:var(--r-2xl);padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line);font-size:14.5px}
.ipri .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ipri .acc button,.ipri select{min-height:44px;padding:0 14px}
.ipri select{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--card);color:var(--ink);max-width:100%}
.ipanel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--bg);box-shadow:var(--sh-panel);padding:16px;overflow:auto;z-index:5}
:where(:root[data-vista="app"]) .ihero{grid-template-columns:84px 1fr}:where(:root[data-vista="app"]) .iacts{grid-column:1/-1;flex-direction:row}:where(:root[data-vista="app"]) .iacts button{flex:1}
:where(:root[data-vista="escritorio"]) .icols{grid-template-columns:repeat(4,minmax(0,1fr))}
/* Columnas del Inicio: orden libre, anillo propio, "+ N más" desplegable, tarjeta Compras */
.icol.arr{opacity:.5}
.icol.sobre{outline:2px dashed var(--a);outline-offset:4px;border-radius:var(--r-m)}
.icol-h[draggable="true"]{cursor:grab}
.icol-mv{display:inline-flex;gap:4px;margin-left:6px}
.icol-mv button{min-width:34px;min-height:34px;padding:0;font-size:12px;line-height:1}
.icol-mv .vt{display:none}
:where(:root[data-vista="app"]) .icol-mv .hz{display:none}:where(:root[data-vista="app"]) .icol-mv .vt{display:inline}:where(:root[data-vista="app"]) .icol-h[draggable="true"]{cursor:default}:where(:root[data-vista="app"]) .icol-mv button{min-width:44px;min-height:44px}
.icol-tg{display:none;min-width:44px;min-height:44px;padding:0;font-size:15px}

 :where(:root[data-vista="app"]) .icol-tg{display:inline-flex;align-items:center;justify-content:center}
 :where(:root[data-vista="app"]) .icol.cerrada>:not(.icol-h):not(.icol-r){display:none}   /* cerrada: solo encabezado y anillo */
 :where(:root[data-vista="app"]) .icol.cerrada .icol-h{margin-bottom:6px}
 :where(:root[data-vista="app"]) .icols{gap:10px}

.icol-r{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:12.5px;line-height:1.3}
.icr{position:relative;width:46px;height:46px;flex:none}
.icr svg{display:block;transform:rotate(-90deg)}
.icr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
button.imas{display:block;width:100%;background:transparent;border:1px dashed var(--line);box-shadow:none;color:var(--mute);min-height:44px;border-radius:var(--r-s);font-size:13px;cursor:pointer}
.iidea{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ibadge{flex:none;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 8px}
.icd.compras .icd-x{font-weight:700}
.pcam{list-style:none;margin:4px 0 8px;padding:0}
.pcam li{padding:3px 0;color:var(--mute)}
.pcam li.ok{color:inherit}
.pvacio{display:block;margin-top:12px}   /* el resumen se ve también en celular, debajo del mapa */
.pn:hover rect{stroke-opacity:1}
/* COMPUTADORA PRIMERO: en pantalla ancha, Proyectos usa todo el ancho: mapa completo (sin arrastrar) a la izquierda y tarjeta a la derecha.
   En celular se queda en una columna, con el mapa arrastrable con el dedo. */

 :where(:root[data-vista="escritorio"]) body.ancho{max-width:1360px}
 :where(:root[data-vista="escritorio"]) body.ancho #vista{padding:var(--cap-h) 24px 40px}
 :where(:root[data-vista="escritorio"]) body.ancho .seg, :where(:root[data-vista="escritorio"]) body.ancho header{margin-left:24px;margin-right:24px}
 :where(:root[data-vista="escritorio"]) body.ancho header{padding-left:0;padding-right:0}
 :where(:root[data-vista="escritorio"]) body.ancho .pwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
 :where(:root[data-vista="escritorio"]) body.ancho .pder{position:sticky;top:0}
 :where(:root[data-vista="escritorio"]) body.ancho .pvacio{display:block}
 :where(:root[data-vista="escritorio"]) body.ancho .pmapa, :where(:root[data-vista="escritorio"]) body.ancho .pmapa.cc{height:calc(100vh - 340px);min-height:420px;overflow:hidden}
 :where(:root[data-vista="escritorio"]) body.ancho .pmapa svg{width:100%;height:100%}
 :where(:root[data-vista="escritorio"]) body.ancho .pcard{margin-top:0}

.pcard{margin-top:10px;background:var(--card);border-radius:var(--r-2xl);padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line);font-size:14.5px;line-height:1.35}
.pcard .pg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pcard .ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .pt{font-size:17px}
.pcard .pk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 0 2px}
/* Formulario de edición: letra de 16 px (iOS no amplía) y zonas de toque de 44 px, igual de cómodo con mouse que con el dedo */
.pform .pl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}
/* 5.2b: formulario Nuevo, tareas ligadas y Archivados */
.pform input[type=text]{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px;background:var(--card);color:var(--ink);min-height:44px}
.pfils{display:flex;flex-wrap:wrap;gap:8px}
.pfils .pfil{min-height:44px}
.ptar{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.ptar-t{flex:1;min-width:0;overflow-wrap:anywhere}
.ptar button,.ptar-n button{min-height:44px;padding:0 14px;flex:none}
.ptar-n{display:flex;gap:8px;margin-top:8px;align-items:center}
.ptar-n select{flex:1;min-width:0;min-height:44px;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:0 8px;background:var(--card);color:var(--ink)}
.iarch{margin:14px 0 4px;text-align:center}
.iarch button{min-height:44px;padding:0 16px;background:transparent;box-shadow:none;border:1px dashed var(--line);color:var(--mute)}
.inuevo{min-height:44px;padding:0 14px}
.pform textarea,.pform select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px;background:var(--card);color:var(--ink);min-height:44px}
.pform textarea{resize:vertical;min-height:68px}
.pchk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px;margin-top:6px}
.pchk input{width:22px;height:22px;flex:none}
.pcal{display:flex;gap:6px;flex-wrap:wrap}
.pcal button{min-width:44px;min-height:44px;padding:0 12px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--card);box-shadow:none}
.pcal button.on{background:var(--now);border-color:var(--now);color:var(--on-now);font-weight:700}
.pform .acc button,.pcard .acc button{min-height:44px}
.pcls2{width:34px;height:34px;padding:0;border-radius:50%;box-shadow:none;background:var(--bg);flex:none}
.dia-card{display:block;width:100%;text-align:left;padding:2px 0 4px;margin:2px 0 10px;border-radius:0;background:transparent;box-shadow:none}
.dia-card .dc-strip{margin-top:0;height:16px}
.dc-go{color:var(--now-t);font-weight:700;font-size:12.5px;white-space:nowrap}
/* Alerta de comida: aparece arriba en TODAS las pantallas y sube de intensidad (13:00 aviso · 14:00 urgente · 15:00 rojo y pulsando) hasta que se toca "Ya comí" */
#alerta{flex:none;margin:0 16px 8px;border-radius:var(--r-l);padding:10px 12px;display:flex;align-items:center;gap:10px}
#alerta .at{flex:1;font-weight:800;line-height:1.25;font-size:15.5px}
#alerta .as{display:block;font-weight:500;font-size:13px;margin-top:2px}
#alerta button{flex:none;padding:11px 14px;font-weight:800;font-size:15px;border-radius:var(--r-m)}
#alerta.n1{background:var(--warn-bg);border-left:6px solid var(--warn);color:var(--ink)}
#alerta.n2{background:var(--fire-bg);border-left:6px solid var(--fire);color:var(--fire-ink)}
#alerta.n2 button{background:var(--fire);color:var(--on-fire)}
#alerta.n3{background:var(--rec);color:var(--on-rec);animation:alerta 1.4s ease-in-out infinite}
#alerta.n3 button{background:var(--on-rec);color:var(--rec-deep)}
@keyframes alerta{50%{box-shadow:0 0 0 5px var(--rec-ring)}}
@media (prefers-reduced-motion:reduce){#alerta.n3{animation:none}}
/* Hoy en escritorio: tira del día arriba a todo lo ancho · el foco a la izquierda · tu día a la derecha */

 :where(:root[data-vista="escritorio"]) .hoy{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);grid-template-areas:"top top" "main rail";column-gap:28px;align-items:start}
 :where(:root[data-vista="escritorio"]) .hoy-top{grid-area:top}:where(:root[data-vista="escritorio"]) .hoy-main{grid-area:main}:where(:root[data-vista="escritorio"]) .hoy-rail{grid-area:rail;border-left:1px solid var(--line);padding-left:24px;min-height:300px}
 :where(:root[data-vista="escritorio"]) .hoy .hero{padding:22px 26px}
 :where(:root[data-vista="escritorio"]) .hoy .hero h2{font-size:26px}
 :where(:root[data-vista="escritorio"]) .hoy .hero .hora{font-size:14px}
 :where(:root[data-vista="escritorio"]) .hoy .hero.paso h2{font-size:20px}
 :where(:root[data-vista="escritorio"]) .hoy .hero .acc .pri{font-size:18px;padding:12px 28px}
 :where(:root[data-vista="escritorio"]) .hoy-rail details>summary{pointer-events:none;list-style:none;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-size:11.5px}
 :where(:root[data-vista="escritorio"]) .hoy-rail details>summary::-webkit-details-marker{display:none}
 :where(:root[data-vista="escritorio"]) .hoy .it:hover{background:color-mix(in srgb,var(--now) 6%,transparent)}

/* Proyectos: cada nodo lleva el color de su sección (con ícono y nombre) y el panel vacío es un resumen */
.pley{display:flex;gap:16px;flex-wrap:wrap;margin:2px 2px 8px;font-size:13px;color:var(--mute)}
.pley span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.pley .s-t{--c:var(--cal)} .pley .s-p{--c:var(--k-rut)} .pley .s-i{--c:var(--mute)}
.pn.s-t rect{stroke:var(--cal);stroke-opacity:.95}
.pn.s-p rect{stroke:var(--k-rut);stroke-opacity:.95}
.pres{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pres>div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.pres b{display:block;font-size:26px;line-height:1.1}
.pres span{font-size:12.5px;color:var(--mute)}
/* Mañana, día y Semana (2026-11-27): escritorio con estructura propia, celular en una columna */
.dia2-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 2px 10px}
.dia2-t h2{margin:0;font-size:22px;letter-spacing:-.01em}
.dia2-chip{font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 12px}
.dia2-res{background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.dia2-res .dc-strip{margin-top:0;height:20px}
.dia2-cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.dia2-cifras>div{min-width:0}
.dia2-cifras b{display:block;font-size:22px;line-height:1.1}
.dia2-cifras span{font-size:12.5px;color:var(--mute)}
.dia2-nota{margin:0 2px 10px}
.dia2-h{margin-top:4px}
.sem-i{display:flex;gap:8px;align-items:baseline;font-size:13.5px;line-height:1.3;padding:3px 0 3px 8px;border-left:3px solid var(--k,var(--k-otro));margin-top:5px;overflow-wrap:anywhere}
.sem-i .h{flex:none;color:var(--mute);font-size:11.5px;min-width:38px}
.sem-mas,.sem-vacio{font-size:12.5px;color:var(--mute);margin-top:5px}
.sem-d.finde{background:color-mix(in srgb,var(--line) 14%,transparent)}
.sem-lista{min-height:20px}
.ghost{min-height:44px}
.sem-bloque .card{margin-bottom:10px}

 :where(:root[data-vista="escritorio"]) .dia2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);grid-template-areas:"top top" "main rail";column-gap:28px;align-items:start}
 :where(:root[data-vista="escritorio"]) .dia2-top{grid-area:top}:where(:root[data-vista="escritorio"]) .dia2-main{grid-area:main}:where(:root[data-vista="escritorio"]) .dia2-rail{grid-area:rail;position:sticky;top:0}
 :where(:root[data-vista="escritorio"]) .dia2-t h2{font-size:28px}
 :where(:root[data-vista="escritorio"]) .dia2-main .it:hover{background:color-mix(in srgb,var(--now) 6%,transparent)}
 :where(:root[data-vista="escritorio"]) .sem-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:stretch}
 :where(:root[data-vista="escritorio"]) .sem-d{margin-bottom:0;display:flex;flex-direction:column;min-height:260px;padding:12px}
 :where(:root[data-vista="escritorio"]) .sem-d:hover{border-color:color-mix(in srgb,var(--now) 55%,transparent)}
 :where(:root[data-vista="escritorio"]) .sem-d .sem-lista{flex:1}
 :where(:root[data-vista="escritorio"]) .sem-d .dc-strip{height:14px}
 :where(:root[data-vista="escritorio"]) .sem-extra{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}

/* Aviso de versión nueva */
#verNueva{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border-radius:var(--r-pill);box-shadow:var(--sh-pop);padding:4px 4px 4px 16px;max-width:calc(100% - 24px);font-size:14.5px}
#verNueva button{min-height:44px;min-width:44px;padding:0 14px;border-radius:var(--r-pill)}
/* Celular (A y B, 2026-11-27): cabecera más baja y aviso de comida en una línea que se abre al tocarlo */

 :where(:root[data-vista="app"]) header{padding:8px 16px 0}
 :where(:root[data-vista="app"]) .sol{width:44px;height:44px}
 :where(:root[data-vista="app"]) .saludo{font-size:16px}
 :where(:root[data-vista="app"]) .fechaTxt{font-size:12px;margin-top:0}
 :where(:root[data-vista="app"]) .seg{gap:6px;margin:2px 16px 4px}
 :where(:root[data-vista="app"]) .seg button{min-height:44px;min-width:44px;padding:0 10px}
 :where(:root[data-vista="app"]) #alerta{padding:4px 10px;margin:0 16px 4px}
 :where(:root[data-vista="app"]) #alerta .at{font-size:14.5px;cursor:pointer;min-height:44px;display:flex;flex-wrap:wrap;align-items:center;column-gap:6px}
 :where(:root[data-vista="app"]) #alerta .as{display:none;flex-basis:100%}
 :where(:root[data-vista="app"]) #alerta.abierto .as{display:block}
 :where(:root[data-vista="app"]) #alerta .at::before{content:"▾";opacity:.6;font-size:12px}
 :where(:root[data-vista="app"]) #alerta.abierto .at::before{content:"▴"}
 :where(:root[data-vista="app"]) #alerta button{min-height:44px}

.ghost{width:100%;margin-top:8px;background:transparent;border:1px solid var(--line);box-shadow:none;padding:8px;font-size:14px;color:var(--mute)}
.fi{font-size:12px;opacity:.8}
.dc-strip{position:relative;height:24px;border-radius:var(--r-m);background:var(--bg);margin-top:12px;overflow:hidden;border:1px solid var(--line)}
.sg{position:absolute;top:3px;bottom:3px;border-radius:6px}
.sg{background:var(--k,var(--k-otro))}
.dc-now{position:absolute;top:0;bottom:0;width:3px;background:var(--now-line);border-radius:2px}
.dc-h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:5px}
/* Planear el día */
#plan{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:0 16px 220px;z-index:6}
#plan .in{max-width:680px;margin:0 auto}
#plan .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap;padding:10px 0 8px;position:sticky;top:0;background:var(--bg);z-index:9}
.blk.emp{outline:2px dashed var(--warn);outline-offset:-2px}
.blk .bt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blk.peq{padding-top:3px;padding-bottom:3px;line-height:1.2}
.blk.peq .bt{-webkit-line-clamp:1}
#plan h1{font-size:20px;margin:0}
/* Encabezado del planificador: una sola fila, todo de 40 px de alto. Izquierda: ‹ día › en una píldora. Derecha: ＋ Agregar y ✕ */
.pnav{display:flex;align-items:center;background:var(--card);border-radius:var(--r-pill);box-shadow:var(--sh);padding:2px;flex:none}
.pnav button{width:36px;height:36px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:transparent;box-shadow:none}
#plan .pnav h1{font-size:16px;min-width:62px;text-align:center;white-space:nowrap}
.pacc{display:flex;align-items:center;gap:8px;flex:none}
.padd{height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--now);color:var(--card);font-weight:700;font-size:15px;white-space:nowrap;box-shadow:none}
.pcls{width:40px;height:40px;padding:0;border-radius:50%;font-size:16px;line-height:1;background:var(--card);box-shadow:var(--sh)}
.selbar .row button{padding:9px 12px;font-size:14px}
@media (max-width:350px){.pnav button{width:32px}#plan .pnav h1{min-width:52px;font-size:15px}.padd{padding:0 10px;font-size:14px}}

/* ===== Franja superior (2026-11-27): sol de línea, saludo, Menú, pestañas y aviso de comida en el mismo lenguaje que el resto =====
   Celular: dos filas (saludo y Menú; pestañas). Escritorio (900 px o más): una sola fila (saludo · pestañas · Menú) con una línea fina debajo. */
#topbar{flex:none}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 16px 0}
.hdr{display:flex;gap:12px;align-items:center;min-width:0}

.sol-hz,.sol-arco,.sol-noche{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round}

#btnMenu:hover{border-color:color-mix(in srgb,var(--now) 55%,transparent);background:color-mix(in srgb,var(--now) 8%,transparent)}
#btnMenu .mn-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--now);color:var(--on-now);font-size:12px;font-weight:700}
.seg{flex:none;display:flex;gap:22px;margin:0 16px;padding:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.seg button{flex:none;min-height:44px;min-width:44px;padding:0 2px;box-shadow:none;background:transparent;border-radius:0;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .16s}

 :where(:root[data-vista="escritorio"]) #topbar .hdr{order:1}
 :where(:root[data-vista="escritorio"]) #topbar .seg{order:2}
 :where(:root[data-vista="escritorio"]) #topbar #btnMenu{order:3;align-self:center;justify-self:end}

/* Aviso de comida: tinte sutil del color del nivel (sin bloque sólido) */
#alerta{--c:var(--warn);flex:none;margin:8px 16px 2px;border-radius:var(--r-2xl);padding:4px 6px 4px 14px;display:flex;align-items:center;gap:10px;color:var(--ink);background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
#alerta.n1{--c:var(--warn);background:color-mix(in srgb,var(--c) 11%,var(--card));border-color:color-mix(in srgb,var(--c) 42%,transparent);color:var(--ink);border-left:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
#alerta.n2{--c:var(--fire);background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:color-mix(in srgb,var(--c) 50%,transparent);color:var(--ink);border-left:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
#alerta.n3{--c:var(--rec);background:color-mix(in srgb,var(--c) 16%,var(--card));border-color:color-mix(in srgb,var(--c) 60%,transparent);color:var(--ink);animation:alerta2 2.4s ease-in-out infinite}

/* ===== Formularios, Menú y entrar a la cuenta (2026-11-27): un solo kit, mismo lenguaje que la barra de notas y la franja superior ===== */
:root{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}

.seg2{display:inline-flex;flex-wrap:wrap;gap:4px;padding:2px;border:1px solid var(--line);border-radius:var(--r-pill);background:color-mix(in srgb,var(--card) 50%,transparent)}

.sw,.sw-in{position:relative;appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;min-height:0;padding:0;border-radius:var(--r-pill);border:1px solid var(--line);background:color-mix(in srgb,var(--line) 55%,transparent);box-shadow:none;cursor:pointer;transition:background .16s,border-color .16s}

.mn-fila{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;padding:6px 0}
.mn-fila + .mn-fila{border-top:1px solid var(--line)}

#menu{background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2)}
